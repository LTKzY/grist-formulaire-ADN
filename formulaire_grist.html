<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Formulaire de session</title>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 25px;
    background: #f7f7f7;
    color: #333;
}

.container {
    max-width: 1200px;
    margin: auto;
}

h1 {
    font-size: 26px;
    margin-top: 0;
    margin-bottom: 25px;
}

h2 {
    font-size: 19px;
    margin-top: 0;
    margin-bottom: 20px;
}


/* =====================================================
   SECTIONS
===================================================== */

.section {
    background: white;
    padding: 22px;
    margin-bottom: 20px;
    border-radius: 9px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
}


/* =====================================================
   CHAMPS
===================================================== */

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(250px, 1fr));
    gap: 18px;
}

.field {
    display: flex;
    flex-direction: column;
}

label {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 14px;
}

input,
select {
    width: 100%;
    padding: 9px 10px;
    min-height: 40px;
    border: 1px solid #c8c8c8;
    border-radius: 6px;
    background: white;
    font-size: 14px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #3574e8;
    box-shadow: 0 0 0 2px rgba(53,116,232,0.12);
}

.help {
    margin-top: 5px;
    font-size: 12px;
    color: #777;
}

.field-error {
    margin-top: 5px;
    font-size: 12px;
    min-height: 16px;
}


/* =====================================================
   PARTICIPANTS
===================================================== */

.participant-header {
    display: grid;
    grid-template-columns:
        1.2fr
        1.3fr
        1.5fr
        1.3fr
        42px;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: bold;
    color: #666;
}

.participant {
    display: grid;
    grid-template-columns:
        1.2fr
        1.3fr
        1.5fr
        1.3fr
        42px;
    gap: 8px;
    margin-bottom: 10px;
    align-items: center;
}


/* =====================================================
   BOUTONS
===================================================== */

button {
    border: none;
    border-radius: 6px;
    padding: 10px 17px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.add {
    background: #eeeeee;
    color: #333;
    margin-top: 10px;
}

.add:hover {
    background: #dddddd;
}

.delete {
    width: 40px;
    height: 40px;
    padding: 0;
    background: #eeeeee;
    font-size: 20px;
}

.delete:hover {
    background: #dddddd;
}

.submit {
    background: #3574e8;
    color: white;
    font-size: 15px;
}

.submit:hover {
    background: #285bc0;
}

.submit:disabled {
    opacity: 0.6;
    cursor: wait;
}

.new-session {
    background: #eeeeee;
    color: #333;
}

.new-session:hover {
    background: #dddddd;
}

.action-buttons {
    display: flex;
    gap: 10px;
}


/* =====================================================
   ACTIONS
===================================================== */

.buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 15px;
}


/* =====================================================
   MESSAGES
===================================================== */

#message {
    min-height: 20px;
    font-weight: bold;
    font-size: 14px;
}

.success {
    color: #16803c;
}

.error {
    color: #c62828;
}


/* =====================================================
   MODALE DE RECAPITULATIF
===================================================== */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.visible {
    display: flex;
}

.modal {
    background: white;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 10px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.25);
    padding: 25px;
}

.modal h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

.summary-section {
    margin-bottom: 22px;
}

.summary-section h3 {
    font-size: 16px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #ddd;
}

.summary-grid {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 7px 15px;
}

.summary-label {
    font-weight: bold;
    color: #666;
}

.summary-value {
    color: #222;
}

.summary-participants {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.summary-participants th,
.summary-participants td {
    padding: 9px 8px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

.summary-participants th {
    background: #f5f5f5;
    font-weight: bold;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

.cancel {
    background: #eeeeee;
    color: #333;
}

.cancel:hover {
    background: #dddddd;
}

.confirm {
    background: #3574e8;
    color: white;
}

.confirm:hover {
    background: #285bc0;
}

.confirm:disabled {
    opacity: 0.6;
    cursor: wait;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 900px) {

    .grid {
        grid-template-columns: 1fr;
    }

    .participant-header {
        display: none;
    }

    .participant {
        grid-template-columns: 1fr;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 7px;
    }

    .delete {
        width: 100%;
    }

    .buttons {
        flex-direction: column;
        align-items: stretch;
    }

    .action-buttons {
        width: 100%;
        flex-direction: column;
    }

    .action-buttons button {
        width: 100%;
    }

    .summary-grid {
        grid-template-columns: 1fr;
    }

    .summary-participants {
        font-size: 12px;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>
    Nouvelle session
</h1>


<!-- =====================================================
     INFORMATIONS SESSION
===================================================== -->

<div class="section">

<h2>
    Informations de la session
</h2>

<div class="grid">


<div class="field">

<label for="annee">
    Année *
</label>

<select id="annee" required>
    <option value="">
        -- Choisir --
    </option>
</select>

</div>


<div class="field">

<label for="date">
    Date *
</label>

<input
    id="date"
    type="text"
    placeholder="DD-MM-YYYY"
    maxlength="10"
    autocomplete="off"
    required
>

<div class="help">
    Format : 25-08-2026
</div>

<div
    id="dateError"
    class="field-error"
>
</div>

</div>


<div class="field">

<label for="type">
    Type *
</label>

<select id="type" required>
    <option value="">
        -- Choisir --
    </option>
</select>

</div>


<div class="field">

<label for="intitule">
    Intitulé *
</label>

<select id="intitule" required>
    <option value="">
        -- Choisir --
    </option>
</select>

</div>


<div class="field">

<label for="duree">
    Durée (heures) *
</label>

<input
    id="duree"
    type="number"
    min="0"
    step="0.25"
    required
>

</div>


<div class="field">

<label for="lieu">
    Lieu *
</label>

<select id="lieu" required>
    <option value="">
        -- Choisir --
    </option>
</select>

</div>

</div>

</div>
    
<!-- =====================================================
     PARTICIPANTS
===================================================== -->

<div class="section">

<h2>
    Participants
</h2>

<div class="participant-header">

<div>Nom Prénom</div>
<div>Laboratoire / Service</div>
<div>Etablissement</div>
<div>Catégorie</div>
<div></div>

</div>

<div id="participants">
</div>

<button
    type="button"
    class="add"
    id="addParticipant"
>
    + Ajouter un participant
</button>


<div class="buttons">

<div id="message">
</div>

<div class="action-buttons">

<button
    type="button"
    class="new-session"
    id="newSession"
>
    ↻ Nouvelle session
</button>

<button
    type="button"
    class="submit"
    id="submit"
>
    Enregistrer la session
</button>

</div>

</div>

</div>

</div>


<!-- =====================================================
     MODALE RECAPITULATIF
===================================================== -->

<div
    id="summaryModal"
    class="modal-overlay"
>

<div class="modal">

<h2>
    Vérification de la session
</h2>


<div class="summary-section">

<h3>
    Informations de la session
</h3>

<div
    id="summarySession"
    class="summary-grid"
>
</div>

</div>


<div class="summary-section">

<h3>
    Participants
</h3>

<div id="summaryParticipants">
</div>

</div>


<div class="modal-actions">

<button
    type="button"
    class="cancel"
    id="cancelSummary"
>
    Annuler
</button>

<button
    type="button"
    class="confirm"
    id="confirmSummary"
>
    Confirmer l'enregistrement
</button>

</div>

</div>

</div>


<script>
    
/* =====================================================
   REMPLIR CHOIX SESSION
===================================================== */

function remplirChoixSession() {

    const annee =
        document.getElementById("annee");

    const type =
        document.getElementById("type");

    const intitule =
        document.getElementById("intitule");

    const lieu =
        document.getElementById("lieu");


    ajouterOptions(
        annee,
        CHOIX_ANNEE,
        "-- Choisir --"
    );


    ajouterOptions(
        type,
        CHOIX_TYPE,
        "-- Choisir --"
    );


    ajouterOptions(
        intitule,
        CHOIX_INTITULE,
        "-- Choisir --"
    );


    ajouterOptions(
        lieu,
        CHOIX_LIEU,
        "-- Choisir --"
    );

}
    
/* =====================================================
   CONNEXION GRIST
===================================================== */

grist.ready({
    requiredAccess: "full"
});


/* =====================================================
   CONFIGURATION
===================================================== */

const SOURCE_TABLE = "T2022_2026";

const LAB_TABLE = "Liste_laboratoires";

const COL = {

    annee: "Annee",
    date: "Date",
    type: "Type",
    intitule: "Intitule",
    duree: "Duree_heures_",
    nom: "Nom_Prenom",
    labo: "Laboratoire_Service",
    etablissement: "Etablissement",
    categorie: "Categorie",
    lieu: "Lieu"

};

const LAB_DISPLAY_COL = "Nom_abrege";


/* =====================================================
   CHOICES
===================================================== */

async function chargerChoixDepuisGrist() {

    const metadata =
        await grist.docApi.fetchTable(
            "_grist_Tables_column"
        );


    const tables =
        await grist.docApi.fetchTable(
            "_grist_Tables"
        );


    /*
     * Dans _grist_Tables :
     *
     * id       = identifiant interne
     * tableId  = nom interne de la table
     */

    const tableIds =
        tables.tableId || [];

    const ids =
        tables.id || [];


    let targetTableId = null;


    for (
        let i = 0;
        i < tableIds.length;
        i++
    ) {

        if (
            tableIds[i] === SOURCE_TABLE
        ) {

            targetTableId =
                ids[i];

            break;

        }

    }


    if (
        targetTableId === null ||
        targetTableId === undefined
    ) {

        throw new Error(
            "Impossible de trouver la table " +
            SOURCE_TABLE
        );

    }


    console.log(
        "ID interne de T2022_2026 :",
        targetTableId
    );


    /*
     * Récupération des colonnes
     */

    const parentIds =
        metadata.parentId || [];

    const labels =
        metadata.label || [];

    const types =
        metadata.type || [];

    const widgetOptions =
        metadata.widgetOptions || [];

    console.log(
    "=== COLONNES GRIST ==="
);

for (
    let i = 0;
    i < parentIds.length;
    i++
) {

    console.log({

        index: i,

        parentId: parentIds[i],

        label: labels[i],

        type: types[i],

        widgetOptions: widgetOptions[i]

    });

}

    
    const choix = {};


    const colonnesRecherchees = [

        COL.annee,
        COL.type,
        COL.intitule,
        COL.etablissement,
        COL.categorie,
        COL.lieu

    ];


    for (
        let i = 0;
        i < parentIds.length;
        i++
    ) {

        /*
         * On ne regarde que les colonnes
         * appartenant à T2022_2026.
         */

        if (
            parentIds[i] !== targetTableId
        ) {

            continue;

        }


        const nomColonne =
            labels[i];


        if (
            !colonnesRecherchees.includes(
                nomColonne
            )
        ) {

            continue;

        }


        console.log(
            "Colonne trouvée :",
            nomColonne,
            "Type :",
            types[i]
        );


        if (
            types[i] !== "Choice"
        ) {

            console.warn(
                nomColonne +
                " n'est pas une colonne Choice."
            );

            continue;

        }


        let options = {};


        try {

            options =
                JSON.parse(
                    widgetOptions[i] || "{}"
                );

        }

        catch(error) {

            console.error(
                "Erreur de lecture des options de " +
                nomColonne,
                error
            );

            continue;

        }


        /*
         * Récupération des choix
         */

        const values =
            options.choices || [];


        choix[nomColonne] =
            values
                .map(
                    choice => {

                        if (
                            typeof choice === "string"
                        ) {

                            return choice;

                        }


                        return (
                            choice.label ??
                            choice.value ??
                            choice.name ??
                            ""
                        );

                    }
                )
                .filter(
                    value =>
                        value !== ""
                );

    }


    console.log(
        "CHOIX RÉCUPÉRÉS DEPUIS GRIST :",
        choix
    );


    return choix;

}
    
/* =====================================================
   LABORATOIRES
===================================================== */

let laboratoires = [];
let CHOIX_ANNEE = [];
let CHOIX_TYPE = [];
let CHOIX_INTITULE = [];
let CHOIX_ETABLISSEMENT = [];
let CHOIX_CATEGORIE = [];
let CHOIX_LIEU = [];

/* =====================================================
   DONNÉES EN ATTENTE DE CONFIRMATION
===================================================== */

let recordsEnAttente = [];


/* =====================================================
   CHARGEMENT LABORATOIRES
===================================================== */

async function chargerLaboratoires() {

    const data =
        await grist.docApi.fetchTable(
            LAB_TABLE
        );

    console.log(
        "Données Liste_laboratoires :",
        data
    );

    laboratoires = [];

    if (
        !data ||
        typeof data !== "object"
    ) {

        throw new Error(
            "Format inattendu des données de Liste_laboratoires."
        );

    }

    const ids =
        data.id || [];

    const noms =
        data[LAB_DISPLAY_COL]
        ??
        data["$" + LAB_DISPLAY_COL]
        ??
        data["Nom abrégé"]
        ??
        [];

    if (
        !Array.isArray(ids) ||
        !Array.isArray(noms)
    ) {

        throw new Error(
            "Impossible de trouver les colonnes id et Nom_abrege dans Liste_laboratoires."
        );

    }

    for (
        let i = 0;
        i < ids.length;
        i++
    ) {

        const nom = noms[i];

        if (
            nom !== null &&
            nom !== undefined &&
            String(nom).trim() !== ""
        ) {

            laboratoires.push({

                id: ids[i],

                nom: String(nom)

            });

        }

    }

    laboratoires.sort(
        (a, b) =>
            a.nom.localeCompare(
                b.nom,
                "fr",
                {
                    sensitivity: "base"
                }
            )
    );

}


/* =====================================================
   AJOUT OPTIONS
===================================================== */

function ajouterOptions(
    select,
    valeurs,
    placeholder
) {

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
        placeholder;

    defaultOption.disabled =
        true;

    defaultOption.selected =
        true;

    select.appendChild(
        defaultOption
    );

    valeurs.forEach(
        valeur => {

            const option =
                document.createElement(
                    "option"
                );

            option.value = valeur;

            option.textContent = valeur;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   AJOUT PARTICIPANT
===================================================== */

function ajouterParticipant() {

    const container =
        document.getElementById(
            "participants"
        );

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "participant";


    /* NOM */

    const nom =
        document.createElement(
            "input"
        );

    nom.type = "text";

    nom.className = "nom";

    nom.placeholder =
        "Nom Prénom";

    nom.required = true;


    /* LABORATOIRE */

    const labo =
        document.createElement(
            "select"
        );

    labo.className = "labo";

    labo.required = true;

    const laboDefault =
        document.createElement(
            "option"
        );

    laboDefault.value = "";

    laboDefault.textContent =
        "-- Laboratoire --";

    laboDefault.disabled = true;

    laboDefault.selected = true;

    labo.appendChild(
        laboDefault
    );

    laboratoires.forEach(
        row => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                row.id;

            option.textContent =
                row.nom;

            labo.appendChild(
                option
            );

        }
    );


    /* ETABLISSEMENT */

    const etablissement =
        document.createElement(
            "select"
        );

    etablissement.className =
        "etablissement";

    etablissement.required =
        true;

ajouterOptions(
    etablissement,
    CHOIX_ETABLISSEMENT,
    "-- Etablissement --"
);


    /* CATEGORIE */

    const categorie =
        document.createElement(
            "select"
        );

    categorie.className =
        "categorie";

    categorie.required =
        true;

ajouterOptions(
    categorie,
    CHOIX_CATEGORIE,
    "-- Catégorie --"
);

    /* SUPPRIMER */

    const supprimer =
        document.createElement(
            "button"
        );

    supprimer.type = "button";

    supprimer.className =
        "delete";

    supprimer.textContent = "×";

    supprimer.title =
        "Supprimer ce participant";

    supprimer.addEventListener(
        "click",
        () => {
            div.remove();
        }
    );


    div.appendChild(nom);

    div.appendChild(labo);

    div.appendChild(etablissement);

    div.appendChild(categorie);

    div.appendChild(supprimer);

    container.appendChild(div);

}


/* =====================================================
   VALIDATION DATE
===================================================== */

function convertirDate(dateFR) {

    const match =
        dateFR.match(
            /^(\d{2})-(\d{2})-(\d{4})$/
        );

    if (!match) {

        throw new Error(
            "La date doit être au format DD-MM-YYYY."
        );

    }

    const jour =
        Number(match[1]);

    const mois =
        Number(match[2]);

    const annee =
        Number(match[3]);


    if (
        mois < 1 ||
        mois > 12
    ) {

        throw new Error(
            "Le mois doit être compris entre 01 et 12."
        );

    }


    if (
        jour < 1 ||
        jour > 31
    ) {

        throw new Error(
            "Le jour doit être compris entre 01 et 31."
        );

    }


    const date =
        new Date(
            Date.UTC(
                annee,
                mois - 1,
                jour
            )
        );


    if (
        date.getUTCFullYear() !== annee ||
        date.getUTCMonth() !== mois - 1 ||
        date.getUTCDate() !== jour
    ) {

        throw new Error(
            "Cette date n'existe pas."
        );

    }


    return (

        `${annee}-` +
        `${String(mois).padStart(2, "0")}-` +
        `${String(jour).padStart(2, "0")}`

    );

}


/* =====================================================
   VALIDATION VISUELLE DATE
===================================================== */

function verifierDate() {

    const input =
        document.getElementById(
            "date"
        );

    const error =
        document.getElementById(
            "dateError"
        );

    const valeur =
        input.value.trim();


    if (!valeur) {

        error.textContent = "";

        input.style.borderColor = "";

        return false;

    }


    try {

        convertirDate(valeur);

        error.textContent =
            "✓ Date valide";

        error.style.color =
            "#16803c";

        input.style.borderColor =
            "#16803c";

        return true;

    }

    catch (e) {

        error.textContent =
            e.message;

        error.style.color =
            "#c62828";

        input.style.borderColor =
            "#c62828";

        return false;

    }

}


/* =====================================================
   CONSTRUCTION DES RECORDS
===================================================== */

function construireRecords() {

    const annee =
        document.getElementById(
            "annee"
        ).value;

    const dateFR =
        document.getElementById(
            "date"
        ).value.trim();

    const type =
        document.getElementById(
            "type"
        ).value;

    const intitule =
        document.getElementById(
            "intitule"
        ).value;

    const duree =
        Number(
            document.getElementById(
                "duree"
            ).value
        );

    const lieu =
        document.getElementById(
            "lieu"
        ).value;


    /* VALIDATION SESSION */

    if (
        !annee ||
        !dateFR ||
        !type ||
        !intitule ||
        !Number.isFinite(duree) ||
        duree < 0 ||
        !lieu
    ) {

        throw new Error(
            "Merci de remplir tous les champs de session."
        );

    }


    const date =
        convertirDate(dateFR);


    /* PARTICIPANTS */

    const lignes =
        document.querySelectorAll(
            ".participant"
        );


    if (
        lignes.length === 0
    ) {

        throw new Error(
            "Ajoutez au moins un participant."
        );

    }


    const records = [];


    lignes.forEach(
        ligne => {

            const nom =
                ligne.querySelector(
                    ".nom"
                ).value.trim();

            const labo =
                ligne.querySelector(
                    ".labo"
                ).value;

            const etablissement =
                ligne.querySelector(
                    ".etablissement"
                ).value;

            const categorie =
                ligne.querySelector(
                    ".categorie"
                ).value;


            if (
                !nom ||
                !labo ||
                !etablissement ||
                !categorie
            ) {

                throw new Error(
                    "Tous les champs des participants doivent être remplis."
                );

            }


            records.push({

                fields: {

                    [COL.annee]:
                        annee,

                    [COL.date]:
                        date,

                    [COL.type]:
                        type,

                    [COL.intitule]:
                        intitule,

                    [COL.duree]:
                        duree,

                    [COL.lieu]:
                        lieu,

                    [COL.nom]:
                        nom,

                    [COL.labo]:
                        Number(labo),

                    [COL.etablissement]:
                        etablissement,

                    [COL.categorie]:
                        categorie

                }

            });

        }
    );


    return records;

}


/* =====================================================
   AFFICHER RECAPITULATIF
===================================================== */

function afficherRecapitulatif() {

    const annee =
        document.getElementById(
            "annee"
        ).value;

    const date =
        document.getElementById(
            "date"
        ).value.trim();

    const type =
        document.getElementById(
            "type"
        ).value;

    const intitule =
        document.getElementById(
            "intitule"
        ).value;

    const duree =
        document.getElementById(
            "duree"
        ).value;

    const lieu =
        document.getElementById(
            "lieu"
        ).value;


    /* SESSION */

    const summarySession =
        document.getElementById(
            "summarySession"
        );

    summarySession.innerHTML = "";


    const informations = [

        ["Année", annee],
        ["Date", date],
        ["Type", type],
        ["Intitulé", intitule],
        ["Durée", duree + " h"],
        ["Lieu", lieu]

    ];


    informations.forEach(
        ([label, valeur]) => {

            const labelElement =
                document.createElement(
                    "div"
                );

            labelElement.className =
                "summary-label";

            labelElement.textContent =
                label;


            const valueElement =
                document.createElement(
                    "div"
                );

            valueElement.className =
                "summary-value";

            valueElement.textContent =
                valeur;


            summarySession.appendChild(
                labelElement
            );

            summarySession.appendChild(
                valueElement
            );

        }
    );


    /* PARTICIPANTS */

    const summaryParticipants =
        document.getElementById(
            "summaryParticipants"
        );

    summaryParticipants.innerHTML = "";


    const lignes =
        document.querySelectorAll(
            ".participant"
        );


    const table =
        document.createElement(
            "table"
        );

    table.className =
        "summary-participants";


    const thead =
        document.createElement(
            "thead"
        );

    const headerRow =
        document.createElement(
            "tr"
        );


    [
        "Nom Prénom",
        "Laboratoire / Service",
        "Etablissement",
        "Catégorie"
    ].forEach(
        titre => {

            const th =
                document.createElement(
                    "th"
                );

            th.textContent =
                titre;

            headerRow.appendChild(th);

        }
    );


    thead.appendChild(
        headerRow
    );

    table.appendChild(
        thead
    );


    const tbody =
        document.createElement(
            "tbody"
        );


    lignes.forEach(
        ligne => {

            const tr =
                document.createElement(
                    "tr"
                );


            const nom =
                ligne.querySelector(
                    ".nom"
                ).value.trim();


            const laboSelect =
                ligne.querySelector(
                    ".labo"
                );

            const labo =
                laboSelect.options[
                    laboSelect.selectedIndex
                ].text;


            const etablissementSelect =
                ligne.querySelector(
                    ".etablissement"
                );

            const etablissement =
                etablissementSelect.options[
                    etablissementSelect.selectedIndex
                ].text;


            const categorieSelect =
                ligne.querySelector(
                    ".categorie"
                );

            const categorie =
                categorieSelect.options[
                    categorieSelect.selectedIndex
                ].text;


            [
                nom,
                labo,
                etablissement,
                categorie
            ].forEach(
                valeur => {

                    const td =
                        document.createElement(
                            "td"
                        );

                    td.textContent =
                        valeur;

                    tr.appendChild(td);

                }
            );


            tbody.appendChild(tr);

        }
    );


    table.appendChild(
        tbody
    );

    summaryParticipants.appendChild(
        table
    );


    document
        .getElementById(
            "summaryModal"
        )
        .classList.add(
            "visible"
        );

}


/* =====================================================
   ENREGISTRER = VALIDATION + RECAP
===================================================== */

function enregistrer() {

    const message =
        document.getElementById(
            "message"
        );

    message.textContent = "";

    message.className = "";


    try {

        /*
         * Validation complète.
         *
         * Si la date est incorrecte,
         * l'erreur est interceptée ici.
         */

        recordsEnAttente =
            construireRecords();


        /*
         * Si tout est correct,
         * afficher le récapitulatif.
         */

        afficherRecapitulatif();

    }

    catch(error) {

        message.textContent =
            error.message;

        message.className =
            "error";


        /*
         * Si l'erreur concerne la date,
         * on réaffiche aussi son message
         * sous le champ.
         */

        if (
            error.message.includes("date")
            ||
            error.message.includes("Date")
        ) {

            verifierDate();

        }

    }

}


/* =====================================================
   CONFIRMER ENREGISTREMENT
===================================================== */

async function confirmerEnregistrement() {

    const message =
        document.getElementById(
            "message"
        );

    const confirmButton =
        document.getElementById(
            "confirmSummary"
        );


    if (
        !recordsEnAttente ||
        recordsEnAttente.length === 0
    ) {

        return;

    }


    confirmButton.disabled =
        true;

    confirmButton.textContent =
        "Enregistrement…";


    try {

        const table =
            grist.getTable(
                SOURCE_TABLE
            );


        await table.create(
            recordsEnAttente
        );


        /*
         * Fermer la fenêtre
         */

        document
            .getElementById(
                "summaryModal"
            )
            .classList.remove(
                "visible"
            );


        /*
         * Message succès
         */

        message.textContent =

            "✓ Session enregistrée : " +

            recordsEnAttente.length +

            " participant" +

            (
                recordsEnAttente.length > 1
                    ? "s"
                    : ""
            ) +

            " ajouté" +

            (
                recordsEnAttente.length > 1
                    ? "s"
                    : ""
            ) +

            ".";

        message.className =
            "success";


        /*
         * Réinitialisation
         */

        document
            .getElementById(
                "participants"
            )
            .innerHTML = "";


        ajouterParticipant();


        document
            .getElementById(
                "annee"
            )
            .value = "";


        document
            .getElementById(
                "date"
            )
            .value = "";


        document
            .getElementById(
                "type"
            )
            .value = "";


        document
            .getElementById(
                "intitule"
            )
            .value = "";


        document
            .getElementById(
                "duree"
            )
            .value = "";


        document
            .getElementById(
                "lieu"
            )
            .value = "";


        const dateError =
            document.getElementById(
                "dateError"
            );


        dateError.textContent = "";


        document
            .getElementById(
                "date"
            )
            .style.borderColor = "";


        recordsEnAttente = [];

    }

    catch(error) {

        console.error(
            "Erreur Grist :",
            error
        );


        message.textContent =
            "Erreur lors de l'enregistrement : " +
            error.message;

        message.className =
            "error";

    }

    finally {

        confirmButton.disabled =
            false;

        confirmButton.textContent =
            "Confirmer l'enregistrement";

    }

}


/* =====================================================
   NOUVELLE SESSION
===================================================== */

function nouvelleSession() {

    const participants =
        document.getElementById(
            "participants"
        );


    const formulaireCommence =

        document.getElementById(
            "annee"
        ).value

        ||

        document.getElementById(
            "date"
        ).value

        ||

        document.getElementById(
            "type"
        ).value

        ||

        document.getElementById(
            "intitule"
        ).value

        ||

        document.getElementById(
            "duree"
        ).value

        ||

        document.getElementById(
            "lieu"
        ).value

        ||

        participants.querySelectorAll(
            ".participant"
        ).length > 1;


    if (formulaireCommence) {

        const confirmation =
            window.confirm(

                "Les informations actuellement saisies vont être supprimées.\n\n" +
                "Voulez-vous commencer une nouvelle session ?"

            );


        if (!confirmation) {

            return;

        }

    }


    document
        .getElementById(
            "annee"
        ).value = "";


    document
        .getElementById(
            "date"
        ).value = "";


    document
        .getElementById(
            "type"
        ).value = "";


    document
        .getElementById(
            "intitule"
        ).value = "";


    document
        .getElementById(
            "duree"
        ).value = "";


    document
        .getElementById(
            "lieu"
        ).value = "";


    participants.innerHTML = "";


    ajouterParticipant();


    const message =
        document.getElementById(
            "message"
        );

    message.textContent = "";

    message.className = "";


    const dateError =
        document.getElementById(
            "dateError"
        );

    dateError.textContent = "";


    document
        .getElementById(
            "date"
        )
        .style.borderColor = "";


    recordsEnAttente = [];


    document
        .getElementById(
            "annee"
        )
        .focus();

}

        /*
