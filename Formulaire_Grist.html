<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulaire formations</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 24px;
    font-size: 28px;
}

.section {
    background: #fff;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

h2 {
    margin: 0 0 18px;
    font-size: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.field {
    min-width: 0;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
}

input,
select,
button {
    font: inherit;
}

input[type="text"],
input[type="number"],
input[type="date"],
select {
    width: 100%;
    min-height: 40px;
    padding: 8px 10px;
    border: 1px solid #c9cdd3;
    border-radius: 6px;
    background: #fff;
}

input:focus,
select:focus {
    outline: none;
    border-color: #4c7ed9;
    box-shadow: 0 0 0 2px rgba(76,126,217,.12);
}

.participants-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}

.participant {
    border: 1px solid #d9dde3;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 14px;
    background: #fafbfc;
}

.participant-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.participant-title {
    font-weight: 700;
}

.participant-actions {
    display: flex;
    gap: 6px;
}

.participant-grid {
    display: grid;
    grid-template-columns: 1.3fr 1.4fr 1.5fr 1.1fr;
    gap: 12px;
}

.actions {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
}

button {
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
}

.btn-primary {
    background: #2563eb;
    color: white;
}

.btn-secondary {
    background: #e9edf3;
    color: #222;
}

.btn-success {
    background: #16803c;
    color: white;
}

.btn-danger {
    background: #dc3545;
    color: white;
}

.btn-small {
    padding: 6px 10px;
    font-size: 13px;
}

button:hover {
    filter: brightness(.96);
}

.formateurs-dropdown {
    position: relative;
    width: 100%;
}

.formateurs-trigger {
    width: 100%;
    min-height: 40px;
    text-align: left;
    background: white;
    border: 1px solid #c9cdd3;
    color: #222;
    position: relative;
    padding-right: 35px;
}

.formateurs-trigger::after {
    content: "▾";
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
}

.formateurs-menu {
    display: none;
    position: absolute;
    z-index: 1000;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #c9cdd3;
    border-radius: 6px;
    box-shadow: 0 5px 18px rgba(0,0,0,.15);
    padding: 8px;
}

.formateurs-menu.open {
    display: block;
}

.formateurs-search {
    width: 100%;
    margin-bottom: 8px;
}

.formateurs-options {
    max-height: 230px;
    overflow-y: auto;
}

.formateur-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 5px;
    cursor: pointer;
    font-weight: normal;
    margin: 0;
}

.formateur-option:hover {
    background: #f2f4f7;
}

.formateurs-selected-count {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
}

.recap {
    margin-top: 20px;
}

.recap-grid {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 8px 14px;
    margin-bottom: 20px;
}

.recap-label {
    font-weight: 700;
}

.recap-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

.recap-table th,
.recap-table td {
    border: 1px solid #d9dde3;
    padding: 8px;
    text-align: left;
    vertical-align: top;
}

.recap-table th {
    background: #f0f2f5;
}

.message {
    display: none;
    padding: 12px 15px;
    border-radius: 6px;
    margin-bottom: 15px;
}

.message.success {
    display: block;
    background: #e5f5eb;
    color: #176b35;
}

.message.error {
    display: block;
    background: #fdeaea;
    color: #a21d1d;
}

.hidden {
    display: none !important;
}

@media (max-width: 800px) {
    .grid,
    .participant-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }

    .actions,
    .participants-header {
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
</head>

<body>
<div class="container">

    <h1>Enregistrement d'une session de formation</h1>

    <div id="message" class="message"></div>

    <form id="sessionForm">

        <section class="section">
            <h2>Informations de la session</h2>

            <div class="grid">

                <div class="field">
                    <label for="annee">Année *</label>
                    <select id="annee" required></select>
                </div>

                <div class="field">
                    <label for="date">Date * <small>(JJ-MM-AAAA)</small></label>
                    <input type="text" id="date" placeholder="JJ-MM-AAAA" maxlength="10" required>
                </div>

                <div class="field">
                    <label for="type">Type *</label>
                    <select id="type" required></select>
                </div>

                <!-- NOUVEAU : DOMAINE -->
                <div class="field">
                    <label for="domaine">Domaine *</label>
                    <select id="domaine" required></select>
                </div>

                <div class="field">
                    <label for="intitule">Intitulé *</label>
                    <select id="intitule" required></select>
                </div>

                <div class="field">
                    <label for="langue">Langue *</label>
                    <select id="langue" required></select>
                </div>

                <div class="field">
                    <label for="duree">Durée (heures) *</label>
                    <input type="number" id="duree" min="0" step="0.25" required>
                </div>

                <div class="field">
                    <label for="lieu">Lieu *</label>
                    <select id="lieu" required></select>
                </div>

                <div class="field full">
                    <label>Formateur(s) *</label>

                    <div class="formateurs-dropdown" id="formateursDropdown">
                        <button type="button"
                                id="formateursTrigger"
                                class="formateurs-trigger">
                            Sélectionner les formateurs
                        </button>

                        <div id="formateursMenu" class="formateurs-menu">
                            <input type="text"
                                   id="formateursSearch"
                                   class="formateurs-search"
                                   placeholder="Rechercher un formateur...">

                            <div id="formateursOptions"
                                 class="formateurs-options"></div>
                        </div>
                    </div>

                    <select id="formateurs" multiple style="display:none;"></select>
                    <div id="formateursCount" class="formateurs-selected-count">
                        Aucun formateur sélectionné
                    </div>
                </div>

            </div>
        </section>

        <section class="section">
            <div class="participants-header">
                <h2>Participants</h2>
                <button type="button"
                        id="ajouterParticipantBtn"
                        class="btn-secondary">
                    + Ajouter un participant
                </button>
            </div>

            <div id="participantsContainer"></div>
        </section>

        <div class="actions">
            <button type="button"
                    id="nouvelleSessionBtn"
                    class="btn-secondary">
                Nouvelle session
            </button>

            <button type="submit"
                    class="btn-primary">
                Enregistrer la session →
            </button>
        </div>

    </form>

    <section id="recapSection" class="section recap hidden">
        <h2>Récapitulatif</h2>

        <div id="recapSession"></div>
        <div id="recapParticipants"></div>

        <div class="actions">
            <button type="button"
                    id="modifierBtn"
                    class="btn-secondary">
                ← Modifier
            </button>

            <button type="button"
                    id="confirmerBtn"
                    class="btn-success">
                ✓ Confirmer et enregistrer
            </button>
        </div>
    </section>

</div>

<script>
const SOURCE_TABLE = "T2022_2026";
const SOURCE_TABLE_ID = 1;

const COL = {
    annee: "Annee",
    date: "Date",
    type: "Type",
    domaine: "Domaine",
    intitule: "Intitule",
    langue: "Langue",
    formateurs: "Formateur_s_",
    duree: "Duree_heures_",
    nom: "Nom_Prenom",
    laboratoire: "Laboratoire_Service",
    etablissement: "Etablissement",
    categorie: "Categorie",
    lieu: "Lieu"
};

let choixGrist = {};
let laboratoires = [];
let donneesEnAttente = null;

grist.ready({ requiredAccess: "full" });

/* =========================================================
   UTILITAIRES
   ========================================================= */

function afficherMessage(message, type = "success") {
    const el = document.getElementById("message");
    el.textContent = message;
    el.className = "message " + type;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

function effacerMessage() {
    const el = document.getElementById("message");
    el.textContent = "";
    el.className = "message";
}

function echapperHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   CHOIX DYNAMIQUES DEPUIS GRIST
   ========================================================= */

async function chargerChoixDepuisGrist() {
    const metadata = await grist.docApi.fetchTable("_grist_Tables_column");

    const parentIds = metadata.parentId || [];
    const colIds = metadata.colId || [];
    const types = metadata.type || [];
    const widgetOptions = metadata.widgetOptions || [];

    const colonnesRecherchees = [
        COL.annee,
        COL.type,
        COL.domaine,
        COL.intitule,
        COL.langue,
        COL.formateurs,
        COL.etablissement,
        COL.categorie,
        COL.lieu
    ];

    const choix = {};

    for (let i = 0; i < parentIds.length; i++) {

        if (String(parentIds[i]) !== String(SOURCE_TABLE_ID)) {
            continue;
        }

        const colId = colIds[i];

        if (!colonnesRecherchees.includes(colId)) {
            continue;
        }

        if (
            types[i] !== "Choice" &&
            !(colId === COL.formateurs && types[i] === "ChoiceList")
        ) {
            continue;
        }

        let options = {};

        try {
            options = JSON.parse(widgetOptions[i] || "{}");
        } catch (error) {
            console.error(
                "Erreur de lecture des choix de " + colId,
                error
            );
            continue;
        }

        choix[colId] = Array.isArray(options.choices)
            ? options.choices
            : [];
    }

    return choix;
}

function remplirSelect(id, valeurs, placeholder = "Sélectionner...") {
    const select = document.getElementById(id);

    if (!select) {
        return;
    }

    select.innerHTML = "";

    const placeholderOption = document.createElement("option");
    placeholderOption.value = "";
    placeholderOption.textContent = placeholder;
    placeholderOption.disabled = true;
    placeholderOption.selected = true;

    select.appendChild(placeholderOption);

    (valeurs || []).forEach(valeur => {
        const option = document.createElement("option");
        option.value = valeur;
        option.textContent = valeur;
        select.appendChild(option);
    });
}

function remplirChoixSession() {

    let annees = [...(choixGrist[COL.annee] || [])];

    /*
     * On conserve l'ordre chronologique inverse souhaité
     * pour les années universitaires.
     */
    annees.sort((a, b) => {
        const anneeA = parseInt(String(a).substring(0, 4), 10);
        const anneeB = parseInt(String(b).substring(0, 4), 10);

        if (!isNaN(anneeA) && !isNaN(anneeB)) {
            return anneeB - anneeA;
        }

        return String(a).localeCompare(String(b), "fr");
    });

    remplirSelect("annee", annees);
    remplirSelect("type", choixGrist[COL.type]);
    remplirSelect("domaine", choixGrist[COL.domaine]);
    remplirSelect("intitule", choixGrist[COL.intitule]);
    remplirSelect("langue", choixGrist[COL.langue]);
    remplirSelect("etablissement", choixGrist[COL.etablissement]);
    remplirSelect("categorie", choixGrist[COL.categorie]);
    remplirSelect("lieu", choixGrist[COL.lieu]);

    const selectFormateurs = document.getElementById("formateurs");
    selectFormateurs.innerHTML = "";

    (choixGrist[COL.formateurs] || []).forEach(formateur => {
        const option = document.createElement("option");
        option.value = formateur;
        option.textContent = formateur;
        selectFormateurs.appendChild(option);
    });

    afficherFormateursHorizontaux();
}

/* =========================================================
   FORMATEURS — LISTE DÉROULANTE À CASES À COCHER
   ========================================================= */

function afficherFormateursHorizontaux() {

    const select = document.getElementById("formateurs");
    const container = document.getElementById("formateursOptions");

    if (!select || !container) {
        return;
    }

    container.innerHTML = "";

    Array.from(select.options).forEach(option => {

        const label = document.createElement("label");
        label.className = "formateur-option";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = option.value;
        checkbox.checked = option.selected;

        checkbox.addEventListener("change", () => {
            option.selected = checkbox.checked;
            mettreAJourFormateursDropdown();
        });

        label.appendChild(checkbox);

        const texte = document.createElement("span");
        texte.textContent = option.textContent;

        label.appendChild(texte);
        container.appendChild(label);
    });

    mettreAJourFormateursDropdown();
}

function mettreAJourFormateursDropdown() {

    const select = document.getElementById("formateurs");
    const trigger = document.getElementById("formateursTrigger");
    const count = document.getElementById("formateursCount");

    if (!select || !trigger || !count) {
        return;
    }

    const selectionnes = Array.from(select.selectedOptions)
        .map(option => option.textContent);

    if (selectionnes.length === 0) {
        trigger.textContent = "Sélectionner les formateurs";
        count.textContent = "Aucun formateur sélectionné";
    } else {
        trigger.textContent = selectionnes.join(", ");
        count.textContent =
            selectionnes.length +
            " formateur" +
            (selectionnes.length > 1 ? "s" : "") +
            " sélectionné" +
            (selectionnes.length > 1 ? "s" : "");
    }
}

function initialiserDropdownFormateurs() {

    const trigger = document.getElementById("formateursTrigger");
    const menu = document.getElementById("formateursMenu");
    const search = document.getElementById("formateursSearch");

    if (!trigger || !menu || !search) {
        return;
    }

    trigger.addEventListener("click", event => {
        event.stopPropagation();
        menu.classList.toggle("open");

        if (menu.classList.contains("open")) {
            search.focus();
        }
    });

    menu.addEventListener("click", event => {
        event.stopPropagation();
    });

    document.addEventListener("click", () => {
        menu.classList.remove("open");
    });

    search.addEventListener("input", () => {

        const recherche = search.value
            .trim()
            .toLowerCase();

        document
            .querySelectorAll("#formateursOptions .formateur-option")
            .forEach(label => {

                const texte = label.textContent
                    .toLowerCase();

                label.style.display =
                    texte.includes(recherche)
                        ? "flex"
                        : "none";
            });
    });
}

/* =========================================================
   LABORATOIRES
   ========================================================= */

async function chargerLaboratoires() {

    const data = await grist.docApi.fetchTable("Liste_laboratoires");

    const ids = data.id || [];
    const noms = data.Nom_abrege || [];
    const nomsDeveloppes = data.Nom_developpe || [];

    const resultat = [];

    for (let i = 0; i < ids.length; i++) {

        if (ids[i] === null || ids[i] === undefined) {
            continue;
        }

        const nom = noms[i] ||
            nomsDeveloppes[i] ||
            ("Laboratoire " + ids[i]);

        resultat.push({
            id: Number(ids[i]),
            nom: String(nom)
        });
    }

    resultat.sort((a, b) =>
        a.nom.localeCompare(b.nom, "fr")
    );

    return resultat;
}

function creerOptionsLaboratoires(select, valeur = "") {

    select.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Sélectionner...";
    placeholder.disabled = true;

    if (!valeur) {
        placeholder.selected = true;
    }

    select.appendChild(placeholder);

    laboratoires.forEach(lab => {

        const option = document.createElement("option");

        option.value = String(lab.id);
        option.textContent = lab.nom;

        if (String(lab.id) === String(valeur)) {
            option.selected = true;
        }

        select.appendChild(option);
    });
}

/* =========================================================
   PARTICIPANTS
   ========================================================= */

function ajouterParticipant(donnees = {}) {

    const container = document.getElementById("participantsContainer");

    const participant = document.createElement("div");
    participant.className = "participant";

    participant.innerHTML = `
        <div class="participant-header">
            <div class="participant-title">Participant</div>

            <div class="participant-actions">
                <button type="button"
                        class="btn-secondary btn-small btn-dupliquer">
                    Dupliquer
                </button>

                <button type="button"
                        class="btn-danger btn-small btn-supprimer">
                    Supprimer
                </button>
            </div>
        </div>

        <div class="participant-grid">

            <div class="field">
                <label>Nom, Prénom *</label>
                <input type="text"
                       class="participant-nom"
                       value="${echapperHTML(donnees.nom || "")}"
                       required>
            </div>

            <div class="field">
                <label>Laboratoire / Service *</label>
                <select class="participant-laboratoire" required></select>
            </div>

            <div class="field">
                <label>Etablissement *</label>
                <select class="participant-etablissement" required></select>
            </div>

            <div class="field">
                <label>Catégorie *</label>
                <select class="participant-categorie" required></select>
            </div>

        </div>
    `;

    const selectLab =
        participant.querySelector(".participant-laboratoire");

    const selectEtablissement =
        participant.querySelector(".participant-etablissement");

    const selectCategorie =
        participant.querySelector(".participant-categorie");

    creerOptionsLaboratoires(
        selectLab,
        donnees.laboratoire || ""
    );

    remplirSelectDansParticipant(
        selectEtablissement,
        choixGrist[COL.etablissement] || [],
        donnees.etablissement || ""
    );

    remplirSelectDansParticipant(
        selectCategorie,
        choixGrist[COL.categorie] || [],
        donnees.categorie || ""
    );

    participant
        .querySelector(".btn-supprimer")
        .addEventListener("click", () => {
            participant.remove();

            if (
                document.querySelectorAll(".participant").length === 0
            ) {
                ajouterParticipant();
            }

            renumeroterParticipants();
        });

    participant
        .querySelector(".btn-dupliquer")
        .addEventListener("click", () => {

            ajouterParticipant({
                nom: "",
                laboratoire: selectLab.value,
                etablissement: selectEtablissement.value,
                categorie: selectCategorie.value
            });

            renumeroterParticipants();
        });

    installerGestionEntreeParticipant(participant);

    container.appendChild(participant);

    renumeroterParticipants();

    const nomInput =
        participant.querySelector(".participant-nom");

    if (!donnees.nom) {
        nomInput.focus();
    }
}

function remplirSelectDansParticipant(
    select,
    valeurs,
    valeur = ""
) {

    select.innerHTML = "";

    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Sélectionner...";
    placeholder.disabled = true;

    if (!valeur) {
        placeholder.selected = true;
    }

    select.appendChild(placeholder);

    valeurs.forEach(item => {

        const option = document.createElement("option");

        option.value = item;
        option.textContent = item;

        if (String(item) === String(valeur)) {
            option.selected = true;
        }

        select.appendChild(option);
    });
}

function renumeroterParticipants() {

    document
        .querySelectorAll(".participant")
        .forEach((participant, index) => {

            participant.querySelector(".participant-title")
                .textContent = "Participant " + (index + 1);

            const boutonSupprimer =
                participant.querySelector(".btn-supprimer");

            boutonSupprimer.style.display =
                document.querySelectorAll(".participant").length > 1
                    ? ""
                    : "none";
        });
}

function installerGestionEntreeParticipant(participant) {

    const champs = Array.from(
        participant.querySelectorAll("input, select")
    );

    champs.forEach((champ, index) => {

        champ.addEventListener("keydown", event => {

            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();

            if (champ.classList.contains("participant-categorie")) {

                const participantComplet =
                    participant.querySelector(".participant-nom").value.trim() &&
                    participant.querySelector(".participant-laboratoire").value &&
                    participant.querySelector(".participant-etablissement").value &&
                    participant.querySelector(".participant-categorie").value;

                if (participantComplet) {
                    ajouterParticipant();
                }

                return;
            }

            const suivant = champs[index + 1];

            if (suivant) {
                suivant.focus();
            }
        });
    });
}

/* =========================================================
   LECTURE DES DONNÉES DU FORMULAIRE
   ========================================================= */

function recupererParticipants() {

    return Array.from(
        document.querySelectorAll(".participant")
    ).map(participant => ({

        nom: participant
            .querySelector(".participant-nom")
            .value
            .trim(),

        laboratoire: participant
            .querySelector(".participant-laboratoire")
            .value,

        etablissement: participant
            .querySelector(".participant-etablissement")
            .value,

        categorie: participant
            .querySelector(".participant-categorie")
            .value
    }));
}

function recupererSession() {

    const selectFormateurs =
        document.getElementById("formateurs");

    return {
        annee: document.getElementById("annee").value,
        date: document.getElementById("date").value.trim(),
        type: document.getElementById("type").value,

        // NOUVEAU : DOMAINE
        domaine: document.getElementById("domaine").value,

        intitule: document.getElementById("intitule").value,
        langue: document.getElementById("langue").value,

        formateurs: Array.from(
            selectFormateurs.selectedOptions
        ).map(option => option.value),

        duree: document.getElementById("duree").value,
        lieu: document.getElementById("lieu").value,

        participants: recupererParticipants()
    };
}

/* =========================================================
   VALIDATION
   ========================================================= */

function validerDate(dateString) {

    const match = dateString.match(
        /^(\d{2})-(\d{2})-(\d{4})$/
    );

    if (!match) {
        return false;
    }

    const jour = Number(match[1]);
    const mois = Number(match[2]);
    const annee = Number(match[3]);

    const date = new Date(
        annee,
        mois - 1,
        jour
    );

    return (
        date.getFullYear() === annee &&
        date.getMonth() === mois - 1 &&
        date.getDate() === jour
    );
}

function validerDonnees(donnees) {

    if (!donnees.annee) {
        return "Veuillez sélectionner une année.";
    }

    if (!donnees.date || !validerDate(donnees.date)) {
        return "Veuillez saisir une date valide au format JJ-MM-AAAA.";
    }

    if (!donnees.type) {
        return "Veuillez sélectionner un type.";
    }

    if (!donnees.domaine) {
        return "Veuillez sélectionner un domaine.";
    }

    if (!donnees.intitule) {
        return "Veuillez sélectionner un intitulé.";
    }

    if (!donnees.langue) {
        return "Veuillez sélectionner une langue.";
    }

    if (!donnees.formateurs.length) {
        return "Veuillez sélectionner au moins un formateur.";
    }

    if (
        donnees.duree === "" ||
        isNaN(Number(donnees.duree)) ||
        Number(donnees.duree) <= 0
    ) {
        return "Veuillez saisir une durée valide.";
    }

    if (!donnees.lieu) {
        return "Veuillez sélectionner un lieu.";
    }

    if (!donnees.participants.length) {
        return "Veuillez ajouter au moins un participant.";
    }

    for (let i = 0; i < donnees.participants.length; i++) {

        const p = donnees.participants[i];

        if (!p.nom) {
            return "Veuillez renseigner le nom du participant " +
                (i + 1) + ".";
        }

        if (!p.laboratoire) {
            return "Veuillez renseigner le laboratoire / service du participant " +
                (i + 1) + ".";
        }

        if (!p.etablissement) {
            return "Veuillez renseigner l'établissement du participant " +
                (i + 1) + ".";
        }

        if (!p.categorie) {
            return "Veuillez renseigner la catégorie du participant " +
                (i + 1) + ".";
        }
    }

    return null;
}

/* =========================================================
   CONVERSION DATE
   ========================================================= */

function convertirDate(dateString) {

    const parts = dateString.split("-");

    const jour = Number(parts[0]);
    const mois = Number(parts[1]);
    const annee = Number(parts[2]);

    return Date.UTC(
        annee,
        mois - 1,
        jour
    ) / 1000;
}

/* =========================================================
   RÉCAPITULATIF
   ========================================================= */

function afficherRecap(donnees) {

    const formateurs = donnees.formateurs.join(", ");

    document.getElementById("recapSession").innerHTML = `
        <div class="recap-grid">

            <div class="recap-label">Année</div>
            <div>${echapperHTML(donnees.annee)}</div>

            <div class="recap-label">Date</div>
            <div>${echapperHTML(donnees.date)}</div>

            <div class="recap-label">Type</div>
            <div>${echapperHTML(donnees.type)}</div>

            <div class="recap-label">Domaine</div>
            <div>${echapperHTML(donnees.domaine)}</div>

            <div class="recap-label">Intitulé</div>
            <div>${echapperHTML(donnees.intitule)}</div>

            <div class="recap-label">Langue</div>
            <div>${echapperHTML(donnees.langue)}</div>

            <div class="recap-label">Formateur(s)</div>
            <div>${echapperHTML(formateurs)}</div>

            <div class="recap-label">Durée</div>
            <div>${echapperHTML(donnees.duree)} heure(s)</div>

            <div class="recap-label">Lieu</div>
            <div>${echapperHTML(donnees.lieu)}</div>

        </div>
    `;

    let lignes = "";

    donnees.participants.forEach((p, index) => {

        const lab = laboratoires.find(
            l => String(l.id) === String(p.laboratoire)
        );

        lignes += `
            <tr>
                <td>${index + 1}</td>
                <td>${echapperHTML(p.nom)}</td>
                <td>${echapperHTML(lab ? lab.nom : p.laboratoire)}</td>
                <td>${echapperHTML(p.etablissement)}</td>
                <td>${echapperHTML(p.categorie)}</td>
            </tr>
        `;
    });

    document.getElementById("recapParticipants").innerHTML = `
        <h3>Participants (${donnees.participants.length})</h3>

        <table class="recap-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nom, Prénom</th>
                    <th>Laboratoire / Service</th>
                    <th>Etablissement</th>
                    <th>Catégorie</th>
                </tr>
            </thead>

            <tbody>
                ${lignes}
            </tbody>
        </table>
    `;

    document.getElementById("recapSection")
        .classList.remove("hidden");

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}

/* =========================================================
   ENREGISTREMENT DANS GRIST
   ========================================================= */

async function enregistrerDansGrist(donnees) {

    const actions = [];

    donnees.participants.forEach(participant => {

        const champs = {

            [COL.annee]: donnees.annee,
            [COL.date]: convertirDate(donnees.date),
            [COL.type]: donnees.type,

            // NOUVEAU : DOMAINE
            [COL.domaine]: donnees.domaine,

            [COL.intitule]: donnees.intitule,
            [COL.langue]: donnees.langue,

            [COL.formateurs]: [
                "L",
                ...donnees.formateurs
            ],

            [COL.duree]: Number(donnees.duree),

            [COL.nom]: participant.nom,

            [COL.laboratoire]: participant.laboratoire
                ? ["L", Number(participant.laboratoire)]
                : null,

            [COL.etablissement]: participant.etablissement,
            [COL.categorie]: participant.categorie,
            [COL.lieu]: donnees.lieu
        };

        actions.push([
            "AddRecord",
            SOURCE_TABLE,
            null,
            champs
        ]);
    });

    await grist.docApi.applyUserActions(actions);
}

/* =========================================================
   NOUVELLE SESSION / RESET
   ========================================================= */

function nouvelleSession() {

    document.getElementById("sessionForm").reset();

    const selectFormateurs =
        document.getElementById("formateurs");

    Array.from(selectFormateurs.options)
        .forEach(option => {
            option.selected = false;
        });

    afficherFormateursHorizontaux();

    document.getElementById("participantsContainer")
        .innerHTML = "";

    ajouterParticipant();

    document.getElementById("recapSection")
        .classList.add("hidden");

    donneesEnAttente = null;

    effacerMessage();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

/* =========================================================
   ÉVÉNEMENTS
   ========================================================= */

document
    .getElementById("ajouterParticipantBtn")
    .addEventListener("click", () => {
        ajouterParticipant();
    });

document
    .getElementById("nouvelleSessionBtn")
    .addEventListener("click", () => {
        nouvelleSession();
    });

document
    .getElementById("modifierBtn")
    .addEventListener("click", () => {

        document.getElementById("recapSection")
            .classList.add("hidden");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });

document
    .getElementById("sessionForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        effacerMessage();

        const donnees = recupererSession();

        const erreur = validerDonnees(donnees);

        if (erreur) {
            afficherMessage(erreur, "error");
            return;
        }

        donneesEnAttente = donnees;

        afficherRecap(donnees);
    });

document
    .getElementById("confirmerBtn")
    .addEventListener("click", async () => {

        if (!donneesEnAttente) {
            return;
        }

        const bouton =
            document.getElementById("confirmerBtn");

        bouton.disabled = true;
        bouton.textContent = "Enregistrement...";

        try {

            await enregistrerDansGrist(donneesEnAttente);

            afficherMessage(
                "La session et ses " +
                donneesEnAttente.participants.length +
                " participant(s) ont été enregistrés dans Grist.",
                "success"
            );

            document.getElementById("recapSection")
                .classList.add("hidden");

            donneesEnAttente = null;

            document.getElementById("sessionForm")
                .reset();

            const selectFormateurs =
                document.getElementById("formateurs");

            Array.from(selectFormateurs.options)
                .forEach(option => {
                    option.selected = false;
                });

            afficherFormateursHorizontaux();

            document.getElementById("participantsContainer")
                .innerHTML = "";

            ajouterParticipant();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        } catch (error) {

            console.error(
                "Erreur lors de l'enregistrement :",
                error
            );

            afficherMessage(
                "Erreur lors de l'enregistrement dans Grist : " +
                (error.message || error),
                "error"
            );

        } finally {

            bouton.disabled = false;
            bouton.textContent = "✓ Confirmer et enregistrer";
        }
    });

/* =========================================================
   INITIALISATION
   ========================================================= */

async function initialiser() {

    try {

        choixGrist =
            await chargerChoixDepuisGrist();

        laboratoires =
            await chargerLaboratoires();

        remplirChoixSession();

        initialiserDropdownFormateurs();

        ajouterParticipant();

        console.log(
            "Formulaire initialisé avec succès."
        );

        console.log(
            "Choix récupérés depuis Grist :",
            choixGrist
        );

        console.log(
            "Laboratoires récupérés :",
            laboratoires.length
        );

    } catch (error) {

        console.error(
            "Erreur lors de l'initialisation :",
            error
        );

        afficherMessage(
            "Impossible de charger les données depuis Grist. " +
            "Consultez la console pour plus de détails.",
            "error"
        );
    }
}

initialiser();
