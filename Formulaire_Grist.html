function afficherFormateursHorizontaux() {

    const optionsContainer =
        document.getElementById(
            "formateursOptions"
        );

    const select =
        document.getElementById(
            "formateurs"
        );

    if (!optionsContainer || !select) {
        return;
    }

    optionsContainer.innerHTML = "";

    const options =
        Array.from(select.options)
            .filter(option => option.value);

    if (options.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "formateurs-menu-empty";

        empty.textContent =
            "Aucun formateur disponible";

        optionsContainer.appendChild(empty);

        mettreAJourFormateursDropdown();
        return;
    }

    options.forEach(option => {

        const label =
            document.createElement("label");

        label.className =
            "formateur-option";

        label.dataset.formateur =
            option.textContent.toLowerCase();

        const checkbox =
            document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.value = option.value;
        checkbox.checked = option.selected;

        const text =
            document.createElement("span");

        text.textContent =
            option.textContent;

        label.appendChild(checkbox);
        label.appendChild(text);
        optionsContainer.appendChild(label);

        checkbox.addEventListener(
            "change",
            () => {

                option.selected =
                    checkbox.checked;

                mettreAJourFormateursDropdown();

            }
        );

    });

    mettreAJourFormateursDropdown();

}


function mettreAJourFormateursDropdown() {

    const select =
        document.getElementById(
            "formateurs"
        );

    const trigger =
        document.getElementById(
            "formateursTrigger"
        );

    const triggerText =
        document.getElementById(
            "formateursTriggerText"
        );

    const count =
        document.getElementById(
            "formateursSelectedCount"
        );

    if (!select || !trigger || !triggerText || !count) {
        return;
    }

    const selected =
        Array.from(select.selectedOptions)
            .filter(option => option.value);

    trigger.classList.toggle(
        "has-selection",
        selected.length > 0
    );

    if (selected.length === 0) {

        triggerText.textContent =
            "-- Choisir un ou plusieurs formateurs --";

        count.textContent =
            "Aucun formateur sélectionné";

    } else {

        triggerText.textContent =
            selected
                .map(option => option.textContent)
                .join(", ");

        count.textContent =
            selected.length === 1
                ? "1 formateur sélectionné"
                : selected.length +
                  " formateurs sélectionnés";

    }

}


function initialiserDropdownFormateurs() {

    const dropdown =
        document.getElementById(
            "formateursDropdown"
        );

    const trigger =
        document.getElementById(
            "formateursTrigger"
        );

    const search =
        document.getElementById(
            "formateursSearch"
        );

    const optionsContainer =
        document.getElementById(
            "formateursOptions"
        );

    if (!dropdown || !trigger || !search || !optionsContainer) {
        return;
    }

    trigger.addEventListener(
        "click",
        () => {

            const ouvert =
                dropdown.classList.toggle("open");

            trigger.setAttribute(
                "aria-expanded",
                ouvert ? "true" : "false"
            );

            if (ouvert) {
                search.value = "";
                filtrerFormateurs();
                search.focus();
            }

        }
    );

    search.addEventListener(
        "input",
        filtrerFormateurs
    );

    document.addEventListener(
        "click",
        event => {

            if (!dropdown.contains(event.target)) {
                dropdown.classList.remove("open");
                trigger.setAttribute(
                    "aria-expanded",
                    "false"
                );
            }

        }
    );

    function filtrerFormateurs() {

        const recherche =
            search.value
                .trim()
                .toLowerCase();

        const lignes =
            optionsContainer.querySelectorAll(
                ".formateur-option"
            );

        let visibles = 0;

        lignes.forEach(ligne => {

            const visible =
                !recherche ||
                ligne.dataset.formateur.includes(
                    recherche
                );

            ligne.style.display =
                visible ? "flex" : "none";

            if (visible) {
                visibles++;
            }

        });

        const aucun =
            optionsContainer.querySelector(
                ".formateurs-search-empty"
            );

        if (aucun) {
            aucun.remove();
        }

        if (visibles === 0 && lignes.length > 0) {

            const message =
                document.createElement("div");

            message.className =
                "formateurs-menu-empty formateurs-search-empty";

            message.textContent =
                "Aucun résultat";

            optionsContainer.appendChild(message);

        }

    }

}

function remplirChoixSession() {

    ajouterOptions(
        document.getElementById("annee"),
        CHOIX_ANNEE,
        "-- Choisir --"
    );


    ajouterOptions(
        document.getElementById("type"),
        CHOIX_TYPE,

    );


    ajouterOptions(
        document.getElementById("intitule"),
        CHOIX_INTITULE,
        "-- Choisir --"
    );


    ajouterOptions(
        document.getElementById("langue"),
        CHOIX_LANGUE,
        "-- Choisir --"
    );


    const selectFormateurs =
        document.getElementById("formateurs");

    ajouterOptions(
        selectFormateurs,
        CHOIX_FORMATEURS,
        ""
    );

    afficherFormateursHorizontaux();


    ajouterOptions(
        document.getElementById("lieu"),
        CHOIX_LIEU,
        "-- Choisir --"
    );

}


/* =====================================================
   LABORATOIRES
===================================================== */

async function chargerLaboratoires() {

    const data =
        await grist.docApi.fetchTable(
            "Liste_laboratoires"
        );


    laboratoires = [];


    const ids =
        data.id || [];


    const noms =
        data.Nom_abrege || [];


    for (
        let i = 0;
        i < ids.length;
        i++
    ) {

        if (
            noms[i] !== undefined &&
            noms[i] !== null &&
            noms[i] !== ""
        ) {

            laboratoires.push({

                id:
                    ids[i],

                nom:
                    noms[i]

            });

        }

    }


    laboratoires.sort(
        (a, b) =>
            a.nom.localeCompare(
                b.nom,
                "fr"
            )
    );

}

/* =====================================================
   AUTOCOMPLÉTION LABORATOIRE
   Navigation clavier ↑ ↓ Entrée Échap
===================================================== */

function initialiserRechercheLaboratoire(
    participant
) {

    const searchInput =
        participant.querySelector(
            ".participant-laboratoire-search"
        );


    const hiddenInput =
        participant.querySelector(
            ".participant-laboratoire"
        );


    const results =
        participant.querySelector(
            ".laboratoire-results"
        );


    let correspondances = [];

    let indexSelectionne = -1;


    /* =================================================
       AFFICHER LES RÉSULTATS
    ================================================= */

    function afficherResultats() {

        const recherche =
            searchInput.value
                .trim()
                .toLowerCase();


        results.innerHTML = "";

        indexSelectionne = -1;


        correspondances =
            laboratoires.filter(
                labo => {

                    if (!recherche) {

                        return true;

                    }


                    return labo.nom
                        .toLowerCase()
                        .includes(
                            recherche
                        );

                }
            );


        if (
            correspondances.length === 0
        ) {

            const aucun =
                document.createElement(
                    "div"
                );

            aucun.className =
                "laboratoire-no-result";

            aucun.textContent =
                "Aucun laboratoire trouvé";

            results.appendChild(
                aucun
            );

            results.style.display =
                "block";

            return;

        }


        correspondances.forEach(
            (labo, index) => {

                const result =
                    document.createElement(
                        "div"
                    );

                result.className =
                    "laboratoire-result";

                result.textContent =
                    labo.nom;


                /*
                 * Clic souris
                 */

                result.addEventListener(
                    "mousedown",
                    function(event) {

                        event.preventDefault();

                        selectionnerLaboratoire(
                            index
                        );

                    }
                );


                results.appendChild(
                    result
                );

            }
        );


        results.style.display =
            "block";

    }


    /* =================================================
       SÉLECTIONNER UN LABORATOIRE
    ================================================= */

    function selectionnerLaboratoire(
        index
    ) {

        if (
            index < 0 ||
            index >= correspondances.length
        ) {

            return;

        }


        const labo =
            correspondances[index];


        searchInput.value =
            labo.nom;


        hiddenInput.value =
            labo.id;


        results.style.display =
            "none";


        indexSelectionne =
            -1;

    }


    /* =================================================
       ACTUALISER LA SÉLECTION VISUELLE
    ================================================= */

    function actualiserSelection() {

        const items =
            results.querySelectorAll(
                ".laboratoire-result"
            );


        items.forEach(
            item => {

                item.classList.remove(
                    "selected"
                );

            }
        );


        if (
            indexSelectionne < 0 ||
            indexSelectionne >= items.length
        ) {

            return;

        }


        const element =
            items[indexSelectionne];


        element.classList.add(
            "selected"
        );


        /*
         * On fait défiler automatiquement
         * la liste pour garder le résultat
         * sélectionné visible.
         */

        element.scrollIntoView({
            block: "nearest"
        });

    }


    /* =================================================
       SAISIE
    ================================================= */

    searchInput.addEventListener(
        "input",
        function() {

            /*
             * Une nouvelle saisie invalide
             * l'ancien laboratoire sélectionné.
             */

            hiddenInput.value = "";

            afficherResultats();

        }
    );


    /* =================================================
       FOCUS
    ================================================= */

    searchInput.addEventListener(
        "focus",
        function() {

            afficherResultats();

        }
    );


    /* =================================================
       CLAVIER
    ================================================= */

    searchInput.addEventListener(
        "keydown",
        function(event) {


            /* -----------------------------------------
               FLÈCHE BAS
            ----------------------------------------- */

            if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();


                if (
                    correspondances.length === 0
                ) {

                    return;

                }


                indexSelectionne++;


                if (
                    indexSelectionne >=
                    correspondances.length
                ) {

                    indexSelectionne = 0;

                }


                actualiserSelection();

                return;

            }


            /* -----------------------------------------
               FLÈCHE HAUT
            ----------------------------------------- */

            if (
                event.key === "ArrowUp"
            ) {

                event.preventDefault();


                if (
                    correspondances.length === 0
                ) {

                    return;

                }


                indexSelectionne--;


                if (
                    indexSelectionne < 0
                ) {

                    indexSelectionne =
                        correspondances.length - 1;

                }


                actualiserSelection();

                return;

            }


            /* -----------------------------------------
               ENTRÉE
            ----------------------------------------- */

            if (
                event.key === "Enter"
            ) {

                /*
                 * Si un résultat est sélectionné
                 * avec ↑ ou ↓, on le choisit.
                 */

                if (
                    indexSelectionne >= 0
                ) {

                    event.preventDefault();


                    selectionnerLaboratoire(
                        indexSelectionne
                    );

                    return;

                }


                /*
                 * Si aucun résultat n'est encore
                 * sélectionné, on prend le premier.
                 */

                if (
                    correspondances.length > 0
                ) {

                    event.preventDefault();


                    selectionnerLaboratoire(
                        0
                    );

                }


                return;

            }


            /* -----------------------------------------
               ÉCHAP
            ----------------------------------------- */

            if (
                event.key === "Escape"
            ) {

                event.preventDefault();


                results.style.display =
                    "none";


                indexSelectionne =
                    -1;

            }

        }
    );


    /* =================================================
       PERTE DE FOCUS
    ================================================= */

    searchInput.addEventListener(
        "blur",
        function() {

            /*
             * Petit délai pour permettre
             * au clic sur un résultat de fonctionner.
             */

            setTimeout(
                function() {

                    results.style.display =
                        "none";

                    indexSelectionne =
                        -1;

                },
                150
            );

        }
    );

}

/* =====================================================
   NAVIGATION CLAVIER PARTICIPANT
===================================================== */

function initialiserNavigationClavier(participant) {

    const nom =
        participant.querySelector(
            ".participant-name"
        );

    const laboratoire =
        participant.querySelector(
            ".participant-laboratoire-search"
        );

    const etablissement =
        participant.querySelector(
            ".participant-etablissement"
        );

    const categorie =
        participant.querySelector(
            ".participant-categorie"
        );


    /*
     * Entrée dans le champ Catégorie :
     * crée automatiquement un nouveau participant.
     */

    categorie.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key !== "Enter"
            ) {

                return;

            }


            /*
             * On empêche le comportement
             * par défaut du navigateur.
             */

            event.preventDefault();


            /*
             * On vérifie que le participant
             * actuel est correctement rempli.
             */

            const participantActuel = {
                nom:
                    nom.value.trim(),

                laboratoire:
                    participant
                        .querySelector(
                            ".participant-laboratoire"
                        )
                        .value,

                etablissement:
                    etablissement.value,

                categorie:
                    categorie.value
            };


            if (
                !participantActuel.nom ||
                !participantActuel.laboratoire ||
                !participantActuel.etablissement ||
                !participantActuel.categorie
            ) {

                afficherMessage(
                    "Veuillez compléter ce participant avant d'en créer un nouveau.",
                    "error"
                );

                return;

            }


            /*
             * Création du nouveau participant.
             */

            ajouterParticipant();


            /*
             * Récupération du dernier participant.
             */

            const participants =
                document.querySelectorAll(
                    ".participant"
                );


            const nouveauParticipant =
                participants[
                    participants.length - 1
                ];


            /*
             * Placement automatique
             * du curseur dans Nom, Prénom.
             */

            const nouveauNom =
                nouveauParticipant.querySelector(
                    ".participant-name"
                );


            nouveauNom.focus();

        }
    );


    /*
     * Entrée dans les autres champs :
     * on passe simplement au champ suivant.
     */

    const champs = [
        nom,
        laboratoire,
        etablissement,
        categorie
    ];


    champs.forEach(
        (champ, index) => {

            champ.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key !== "Enter"
                    ) {

                        return;

                    }


                    /*
                     * Pour Catégorie, le traitement
                     * ci-dessus s'en charge déjà.
                     */

                    if (
                        index ===
                        champs.length - 1
                    ) {

                        return;

                    }


                    event.preventDefault();


                    champs[index + 1].focus();

                }
            );

        }
    );

}
      
/* =====================================================
   CRÉATION D'UN PARTICIPANT
===================================================== */

                    type="text"
                    class="participant-name"
                    placeholder="Nom, Prénom"

            <div class="field">

    <label>

    </label>

            type="text"

            required>

</div>


            <div class="field">

                <label>

                </label>

                <select
                    class="participant-etablissement"
                    required>

                    <option value="">
                        -- Choisir --

</div>
    `;


    container.appendChild(

    );


   /*
 * Recherche laboratoire
 */

initialiserRechercheLaboratoire(

      /*

 */

function renumeroterParticipants() {

            ".participant"

    participants.forEach(
        (participant, index) => {

            const number =
                index + 1;


            participant.dataset.number =
                number;


            participant
                .querySelector(
                    ".participant-number"

                number;

    );

        participants.length;

/* =====================================================

===================================================== */

function mettreAJourCompteur() {

    const count =
        document.querySelectorAll(
            ".participant"
        ).length;


    const element =

            "participantsCount"

    element.textContent =

        );

}


/* =====================================================
   DATE
===================================================== */

function dateValide(dateString) {

    const regex =
        /^(\d{2})-(\d{2})-(\d{4})$/;


    const match =
        dateString.match(regex);


    if (!match) {

        return false;

    }


    const jour =
        Number(match[1]);

    const mois =
        Number(match[2]);

    const annee =
        Number(match[3]);


    const date =
        new Date(
            annee,
            mois - 1,
            jour
        );


    return (

        date.getFullYear() === annee &&

        date.getMonth() === mois - 1 &&

        date.getDate() === jour

    );

}


/* =====================================================

function afficherMessage(

/* =====================================================
   RÉCUPÉRATION SESSION
===================================================== */

function recupererSession() {

    return {

        annee:
            document.getElementById(
                "annee"
            ).value,

        date:
            document.getElementById(
                "date"
            ).value,

        type:
            document.getElementById(
                "type"
            ).value,

        intitule:
            document.getElementById(
                "intitule"
            ).value,

        langue:
            document.getElementById(
                "langue"
            ).value,

        formateurs:
            Array.from(
                document.getElementById(
                    "formateurs"
                ).selectedOptions
            ).map(
                option => option.value
            ).filter(
                value => value
            ),

        duree:
            document.getElementById(
                "duree"
            ).value,

        lieu:
            document.getElementById(
                "lieu"
            ).value

    };

}


/* =====================================================
   RÉCUPÉRATION PARTICIPANTS
===================================================== */

function recupererParticipants() {

    const elements =
        document.querySelectorAll(
            ".participant"
        );


    return Array.from(
        elements
    ).map(
        participant => ({

            nom:
                participant
                    .querySelector(
                        ".participant-name"
                    )
                    .value
                    .trim(),

            laboratoire:
                participant
                    .querySelector(
                        ".participant-laboratoire"
                    )
                    .value,

            etablissement:
                participant
                    .querySelector(
                        ".participant-etablissement"
                    )
                    .value,

            categorie:
                participant
                    .querySelector(
                        ".participant-categorie"
                    )
                    .value

        })
    );

}


/* =====================================================
   VALIDATION SESSION
===================================================== */

function validerSession() {

    const session =
        recupererSession();


    /*
     * Si tous les champs obligatoires sont remplis,
     * on vérifie ensuite la date.
     */

    if (
        !session.annee ||
        !session.type ||
        !session.intitule ||
        !session.langue ||
        session.formateurs.length === 0 ||
        !session.date ||
        !session.lieu
    ) {

        afficherMessage(
            "Veuillez compléter tous les champs obligatoires de la session.",
            "error"
        );

        return false;

    }


    /*
     * Validation de la date
     */

    if (
        !dateValide(
            session.date
        )
    ) {

        afficherMessage(
            "La date doit être saisie au format DD-MM-YYYY et correspondre à une date valide.",
            "error"
        );

        return false;

    }


    /*
     * La date est maintenant correcte :
     * on efface l'ancien message d'erreur.
     */

    const message =
        document.getElementById(
            "message"
        );

    message.className =
        "message";

    message.textContent =
        "";


    return true;

}

/* =====================================================
   VALIDATION PARTICIPANTS
===================================================== */

function validerParticipants() {

    const participants =
        recupererParticipants();


    if (
        participants.length === 0
    ) {

        afficherMessage(
            "Ajoutez au moins un participant.",
            "error"
        );

        return false;

    }


    for (
        let i = 0;
        i < participants.length;
        i++
    ) {

        const p =
            participants[i];


        if (
            !p.nom ||
            !p.laboratoire ||
            !p.etablissement ||
            !p.categorie
        ) {

            afficherMessage(
                "Veuillez compléter tous les champs du participant " +
                (i + 1) +
                ".",
                "error"
            );

            return false;

        }

    }


    return true;

}


/* =====================================================

===================================================== */

    const session =

    const participants =
        recupererParticipants();


    document.getElementById(
        "recapAnnee"

    document.getElementById(
        "recapType"

        "recapLangue"

        session.langue;

        session.formateurs.join(", ");

        "recapDate"
    ).textContent =
        session.date;


    document.getElementById(
        "recapDuree"

        session.duree
            ? session.duree + " h"

        session.lieu;


    const tbody =

    tbody.innerHTML = "";


    participants.forEach(

                document.createElement(
                    "tr"

                );

                document.createElement(

                );


            const laboTrouve =
                laboratoires.find(

            labo.textContent =
                laboTrouve
                    ? laboTrouve.nom
                    : participant.laboratoire;


            const etablissement =
                document.createElement(
                    "td"
                );

            etablissement.textContent =
                participant.etablissement;


            const categorie =
                document.createElement(
                    "td"
                );

            categorie.textContent =
                participant.categorie;


            row.appendChild(nom);

            row.appendChild(labo);

            row.appendChild(etablissement);

            row.appendChild(categorie);


            tbody.appendChild(row);

        }
    );


    document.getElementById(
        "sessionCard"
    ).style.display =
        "none";


    document.getElementById(
        "participantsCard"
    ).style.display =
        "none";


    document.getElementById(
        "recapCard"
    ).style.display =
        "block";


    document.getElementById(
        "participantsActions"
    ).style.display =
        "none";


    document.getElementById(
        "recapActions"
    ).style.display =
        "flex";


    mettreAJourProgression(3);


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   PASSAGE AU RÉCAPITULATIF
===================================================== */

function passerAuRecapitulatif() {

    if (
        !validerSession()
    ) {

        return;

    }


    if (
        !validerParticipants()
    ) {

        return;

    }


    afficherRecapitulatif();

}

    });

}


/* =====================================================
   CONVERSION DATE
===================================================== */

function convertirDate(
    dateString
) {

    const parts =
        dateString.split("-");


    const jour =
        Number(parts[0]);

    const mois =
        Number(parts[1]);

    const annee =
        Number(parts[2]);


    return (
        Date.UTC(
            annee,
            mois - 1,
            jour
        ) / 1000
    );

}


/* =====================================================
   ENREGISTREMENT FINAL DANS GRIST
===================================================== */

async function confirmerEnregistrement() {

    if (
        !validerSession() ||
        !validerParticipants()
    ) {

        return;

    }


    const confirmButton =
        document.getElementById(
            "confirmButton"
        );


    confirmButton.disabled =
        true;


    confirmButton.textContent =
        "Enregistrement...";


    try {

        const session =
            recupererSession();


        const participants =
            recupererParticipants();


        const records =
            participants.map(
                participant => ({

                    [COL.annee]:
                        session.annee,

                    [COL.date]:
                        convertirDate(
                            session.date
                        ),

                    [COL.type]:
                        session.type,

                    [COL.intitule]:
                        session.intitule,

                    [COL.langue]:
                        session.langue,

                    [COL.formateurs]:
                        ["L", ...session.formateurs],

                    [COL.duree]:
                        session.duree
                            ? Number(
                                session.duree
                            )
                            : null,

                    [COL.nomPrenom]:
                        participant.nom,

                    [COL.laboratoire]:
                        participant.laboratoire
        ? ["L", Number(participant.laboratoire)]
        : null,

                    [COL.etablissement]:
                        participant.etablissement,

                    [COL.categorie]:
                        participant.categorie,

                    [COL.lieu]:
                        session.lieu

                })
            );


        /*
         * C'EST ICI SEULEMENT que les données
         * sont envoyées dans Grist.
         */

        await grist.docApi.applyUserActions(

            records.map(
                record => [

                    "AddRecord",

                    SOURCE_TABLE,

                    null,

                    record

                ]
            )

        );


        afficherMessage(

            "✓ Session enregistrée avec " +
            participants.length +
            (
                participants.length > 1
                    ? " participants."
                    : " participant."
            ),

            "success"

        );


        confirmButton.textContent =
            "✓ Session enregistrée";


        mettreAJourProgression(3);


    }

    catch(error) {

        console.error(
            error
        );


        afficherMessage(

            "Impossible d'enregistrer la session : " +
            error.message,

            "error"

        );


        confirmButton.disabled =
            false;


        confirmButton.textContent =
            "✓ Confirmer et enregistrer";

    }

}
